# Cassandra AI & Markets Briefing: sources, markets, schedule.
# Everything here is keyless (RSS + public quote APIs). Edit freely, no code change needed.

timezone: Asia/Singapore

# auto mode: which edition runs at which local hour window (see src/briefing/build.py::pick_edition)
schedule:
  morning: {days: [mon, tue, wed, thu, fri], time: "07:30"}   # before Asian markets open (SGX 09:00, Shanghai 09:30)
  evening: {days: [mon, tue, wed, thu, fri], time: "20:30"}   # after Asia closes, before the US opens
  weekly:  {days: [sun], time: "09:00"}                        # week in review + week ahead

# How far back each edition looks for stories (hours). after_weekend applies to Monday morning.
lookback_hours: {morning: 16, evening: 14, weekly: 168, after_weekend: 62}

# What each edition is for. `focus` is given to the editor; `blocks` is the order of the market
# tables (keys of `markets` below). To lead an edition with a different region, reorder its blocks.
editions:
  morning:
    focus: >-
      Morning edition, sent before Asian markets open. The Markets channel is about the trading day
      ahead in mainland China, Hong Kong, Singapore and the rest of Asia-Pacific: where those markets
      last closed, and the overnight session on Wall Street as the lead-in. Prefer market stories
      about China, Hong Kong, Singapore and Asia-Pacific, plus at most one on the overnight US session.
    blocks: [china, apac, singapore, us]
  evening:
    focus: >-
      Evening edition, sent after Asian markets close and before the US market opens. The Markets
      channel covers the US market (last close, futures before tonight's open, what is scheduled
      tonight) and how mainland China and Hong Kong traded today. Prefer one or two stories on the
      US outlook and one on today's China or Hong Kong session.
    blocks: [us, futures, china, singapore, apac]
  weekly:
    focus: >-
      Weekly edition. Summarise the week in AI and the week in markets across the United States,
      Greater China, Singapore and Asia-Pacific, then the week ahead.
    blocks: [us, china, singapore, apac]

# ---------------------------------------------------------------------------------------------
