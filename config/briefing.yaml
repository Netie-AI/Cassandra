# whole-word matches, lowercase
market_keywords: ["shares", "stocks", "stock market", "wall street", "nasdaq", "s&p", "dow", "index", "indices",
                  "federal reserve", "fed", "interest rate", "interest rates", "rate cut", "rate hike", "inflation",
                  "earnings", "ipo", "bonds", "bond yields", "yields", "treasury", "dollar", "straits times index",
                  "sti", "sgx", "nikkei", "hang seng", "kospi", "rally", "sell-off", "selloff", "investors", "profit",
                  "revenue", "gdp", "oil prices", "gold", "equities", "futures",
                  "shanghai composite", "csi 300", "a-shares", "a shares", "shenzhen", "chinext", "hong kong stocks",
                  "mainland stocks", "china stocks", "yuan", "renminbi", "pboc", "people's bank of china",
                  "loan prime rate", "mas", "monetary authority of singapore", "singapore dollar", "asx", "sensex"]

# Topics handled with extra care for this readership. A story that touches one is carried in the
# publisher's own words with attribution, with no rewrite and no commentary, and the briefing's own
# commentary lines may not mention these topics at all. Whole-word matches, lowercase.
sensitive_terms: ["huawei", "hisilicon", "smic", "export control", "export controls", "export curbs", "export ban",
                  "export restrictions", "chip ban", "sanction", "sanctions", "sanctioned", "entity list",
                  "blacklist", "blacklisted", "national security", "espionage", "spy", "spies", "spying",
                  "trade war", "tariff", "tariffs", "decoupling", "taiwan strait",
                  "xi jinping", "communist party", "politburo", "xinjiang", "tibet", "uyghur", "uyghurs",
                  "tiananmen", "dalai lama"]

# ...and combinations: a story that mentions a place in `any` together with a word in `with`.
sensitive_pairs:
  - any: ["china", "chinese", "beijing", "mainland", "hong kong", "taiwan", "us-china", "sino-us"]
    with: ["ties", "links", "short seller", "short sellers", "short-seller", "allegation", "allegations",
           "scrutiny", "export", "exports", "ban", "bans", "banned", "curb", "curbs", "restriction", "restrictions",
           "restrict", "restricts", "military", "military-backed", "pentagon", "congress", "house committee",
           "senate", "security", "sanction", "blacklist", "probe", "probes", "investigation", "crackdown",
           "geopolitical", "geopolitics", "tension", "tensions", "retaliation", "retaliates", "retaliate",
           "dispute", "rivalry", "war"]

# whole-word matches, lowercase
ai_keywords: ["ai", "a.i.", "artificial intelligence", "openai", "chatgpt", "anthropic", "deepmind", "nvidia",
              "llm", "llms", "chatbot", "chatbots", "machine learning", "data centre", "data centres",
              "data center", "data centers", "gpu", "gpus", "semiconductor", "semiconductors", "chip", "chips",
              "chipmaker", "chipmakers", "robot", "robots", "agentic", "deepseek", "tsmc", "generative", "copilot",
              "gemini", "xai", "qwen", "ernie", "doubao", "kimi", "hunyuan", "agi", "superintelligence",
              "self-improving", "frontier model", "frontier models", "hbm", "autonomous weapons"]

# Topics the editor puts first (owner's choice, 2026-11-21). Matching stories are offered to the
# editor ahead of newer ones and marked with the topic name. Selection only: every fact is still
# checked against its source, and sensitive stories are still dropped. Whole-word matches, lowercase.
priority_topics:
  - name: China technology progress
    words: ["china", "chinese", "beijing", "shanghai", "shenzhen", "hangzhou", "hong kong", "alibaba", "baidu",
            "tencent", "bytedance", "deepseek", "qwen", "kimi", "moonshot", "zhipu", "minimax", "hunyuan",
            "doubao", "byd", "xiaomi", "unitree", "cambricon"]
  - name: Frontier AI and what comes next
    words: ["agi", "superintelligence", "superintelligent", "self-improve", "self-improves", "self-improving", "self-improvement", "recursive", "frontier model",
            "frontier models", "reasoning model", "world model", "ai scientist", "automated research",
            "breakthrough", "benchmark", "scaling"]
  - name: Hardware and power shortage
    words: ["chip shortage", "shortage", "shortages", "memory chip", "memory chips", "hbm", "dram", "supply chain",
            "power grid", "electricity", "gigawatt", "data centre power", "data center power", "capacity crunch"]
  - name: AI in defence
    words: ["military", "defence", "defense", "pentagon", "drone", "drones", "autonomous weapons", "battlefield"]

# ---------------------------------------------------------------------------------------------
# Market tables. symbol = Yahoo Finance symbol. label is what a non-specialist reader sees.
#   fx: true      a currency pair: trades around the clock, so it is left out of "which session" logic
#   verify: ...   second-source code used to confirm the figure (see src/briefing/crosscheck.py).
#                 Singapore rows, the SOX index, currencies and futures have no reliable second
#                 source (Sina's Singapore and SOX rows were measured to be stale), so they stand alone.
# ---------------------------------------------------------------------------------------------
markets:
  china:
    name: Greater China
    rows:
      - {symbol: "000001.SS", label: "Shanghai Composite",  note: "mainland China's main index", verify: "tencent:sh000001"}
      - {symbol: "399001.SZ", label: "Shenzhen Component",  note: "Shenzhen-listed companies, more technology", verify: "tencent:sz399001"}
      - {symbol: "000300.SS", label: "CSI 300",             note: "300 largest mainland companies", verify: "tencent:sh000300"}
      - {symbol: "^HSI",      label: "Hang Seng",           note: "Hong Kong's main index", verify: "tencent:hkHSI"}
      - {symbol: "HSTECH.HK", label: "Hang Seng TECH",      note: "large Chinese technology companies listed in Hong Kong", verify: "tencent:hkHSTECH"}
      - {symbol: "CNY=X",     label: "US dollar in yuan",   note: "yuan needed to buy one US dollar", fx: true}
  singapore:
    name: Singapore
    rows:
      - {symbol: "^STI",    label: "Straits Times Index", note: "Singapore's main index"}
      - {symbol: "D05.SI",  label: "DBS",                 note: "Singapore's biggest bank"}
      - {symbol: "SGD=X",   label: "US dollar in SGD",    note: "Singapore dollars needed to buy one US dollar", fx: true}
  apac:
    name: Asia-Pacific
    rows:
      - {symbol: "^N225",   label: "Nikkei 225",          note: "Japan", verify: "sina:b_NKY"}
      - {symbol: "^KS11",   label: "KOSPI",               note: "South Korea, home of Samsung and SK Hynix", verify: "sina:b_KOSPI"}
      - {symbol: "^TWII",   label: "Taiwan Weighted",     note: "Taiwan, home of TSMC", verify: "sina:znb_TWJQ"}
      - {symbol: "^AXJO",   label: "S&P/ASX 200",         note: "Australia", verify: "sina:b_AS51"}
  us:
    name: Wall Street
    rows:
      - {symbol: "^GSPC", label: "S&P 500",             note: "500 biggest US companies", verify: "tencent:usINX"}
      - {symbol: "^IXIC", label: "Nasdaq Composite",    note: "technology-heavy US index", verify: "tencent:usIXIC"}
      - {symbol: "^DJI",  label: "Dow Jones",           note: "30 large US companies", verify: "tencent:usDJI"}
      - {symbol: "^SOX",  label: "Semiconductors (SOX)", note: "US-listed chip companies"}
      - {symbol: "NVDA",  label: "Nvidia",              note: "the biggest AI chip maker", verify: "tencent:usNVDA"}
      - {symbol: "TSM",   label: "TSMC (US-listed)",    note: "the Taiwan firm that manufactures most AI chips", verify: "tencent:usTSM"}
  futures:
    name: US futures
    rows:
      - {symbol: "ES=F", label: "S&P 500 futures", note: "an indication of how US shares may open"}
      - {symbol: "NQ=F", label: "Nasdaq futures",  note: "an indication of how US technology shares may open"}

# "Looking ahead": scheduled data releases and big-tech results (both keyless, see docs/BRIEFING.md).
calendar:
  econ_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"   # this week only; fetch once per run
  countries: {USD: US, CNY: China}                                      # calendar currency code: label shown
  earnings_url: "https://api.nasdaq.com/api/calendar/earnings"          # ?date=YYYY-MM-DD, one call per day
  earnings_days_ahead: 5
  # ticker: name a non-specialist reader recognises
  watchlist: {NVDA: Nvidia, MSFT: Microsoft, GOOGL: "Google (Alphabet)", AMZN: Amazon, META: "Meta (Facebook)",
              AAPL: Apple, TSM: TSMC, AMD: AMD, AVGO: Broadcom, ORCL: Oracle, PLTR: Palantir, TSLA: Tesla,
              BABA: Alibaba, PDD: PDD (Temu), BIDU: Baidu, JD: JD.com}
  # plain meaning of a data release, matched on the event title (first match wins). Country-neutral:
  # the country is printed in front of the title.
  explain:
    - {match: "loan prime rate",    plain: "the benchmark lending rate that banks in China use for loans and mortgages"}
    - {match: "pmi",                plain: "a survey of how busy companies are; a reading above 50 means activity is growing"}
    - {match: "cpi",                plain: "the inflation report: how fast consumer prices are rising"}
    - {match: "ppi",                plain: "prices charged by factories, an early indication of inflation"}
    - {match: "pce",                plain: "the inflation measure the US central bank watches most closely"}
    - {match: "non-farm",           plain: "the monthly US jobs report, the most closely watched figure on the economy"}
    - {match: "unemployment claims", plain: "new applications for jobless benefits, a weekly check on the labour market"}
    - {match: "unemployment rate",  plain: "the share of the workforce without a job"}
    - {match: "federal funds rate", plain: "the US central bank's interest rate decision"}
    - {match: "fomc",               plain: "a signal from the US central bank about where interest rates are heading"}
    - {match: "fed chair",          plain: "remarks by the head of the US central bank, watched for signals on interest rates"}
    - {match: "gdp",                plain: "how fast the economy is growing"}
    - {match: "retail sales",       plain: "how much consumers are spending in shops and online"}
    - {match: "industrial production", plain: "how much factories, mines and utilities produced"}
    - {match: "trade balance",      plain: "exports minus imports"}
    - {match: "new loans",          plain: "how much banks lent in the month, a measure of credit demand"}
    - {match: "fixed asset investment", plain: "spending on buildings, machinery and infrastructure"}
    - {match: "ism",                plain: "a survey of how busy US businesses are"}
    - {match: "consumer sentiment", plain: "a survey of how confident consumers feel"}
    - {match: "consumer confidence", plain: "a survey of how confident consumers feel"}
    - {match: "bank holiday",       plain: "markets are closed"}

# Fallback AI editors, tried in this order when Gemini is rate-limited or down. Each is used only
# if its key is set in the environment. Any OpenAI-compatible chat endpoint works. The same fact
# check runs on the copy whichever editor wrote it.
writers:
  - {name: mistral,    key_env: MISTRAL_API_KEY,    model: mistral-large-latest,        url: "https://api.mistral.ai/v1/chat/completions"}
  - {name: cerebras,   key_env: CEREBRAS_API_KEY,   model: gpt-oss-120b,                url: "https://api.cerebras.ai/v1/chat/completions"}
  - {name: openrouter, key_env: OPENROUTER_API_KEY, model: anthropic/claude-sonnet-4-6, url: "https://openrouter.ai/api/v1/chat/completions"}
