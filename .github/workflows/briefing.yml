# Daily AI Briefing: manual build, then publish to GitHub Pages.
#   Link readers open (always the latest): https://netie-ai.github.io/Cassandra/briefing/
#   The Chinese and English group messages are in each run's summary and at .../briefing/message_zh.txt
#   and .../briefing/message.txt; the link preview image is .../briefing/share.png
# The scheduled run lives on the box (scripts/run_daily_box.sh). This workflow is dispatch only.
# GEMINI_API_KEY is optional. A blank key skips Gemini. MISTRAL_API_KEY and CEREBRAS_API_KEY
# are optional fallbacks. The on-box editor is OpenVault (OV_CASSANDRA_TOKEN), which is not on GitHub.
# A held edition (Gemini MISMATCH or HOLD) is not pushed. A wire fallback is still published
# after one retry, labelled on the page. The box runner refuses wire copy.
# Freshness of the public page is checked by briefing-deadman.yml.
name: Daily AI Briefing

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "morning or evening (leave empty for whichever is due now)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SITE_URL: https://netie-ai.github.io/Cassandra/briefing/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27" "pyyaml>=6.0" "python-dotenv>=1.0" "playwright>=1.40"
      - name: Browser and Chinese fonts for the share image
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: Build the edition
        run: |
          # GEMINI_API_KEY may be empty. Gemini is skipped; another writer is used when its key is set.
          mkdir -p reports/briefings site/briefing/data
          cp site/briefing/data/*.json reports/briefings/ 2>/dev/null || true    # earlier editions
          python -m src.briefing --edition "${{ inputs.edition || 'auto' }}"
          # Gemini is sometimes overloaded (503) for minutes: if the editor fell back to raw headlines,
          # wait and build once more. A second fallback is published as is, labelled on the page.
          newest() { python -c "import glob,json;f=max(glob.glob('reports/briefings/????-??-??-*.json'),key=lambda p:json.load(open(p))['generated_at']);print(json.load(open(f))['writer'])"; }
          if [ "$(newest)" = "wire" ]; then
            echo "::warning::AI editor unavailable, retrying in 5 minutes"; sleep 300
            python -m src.briefing --edition "${{ inputs.edition || 'auto' }}"
          fi
          cp reports/briefings/????-??-??-*.json site/briefing/data/

      - name: Daily Crash Risk Score (history kept on gh-pages)
        continue-on-error: true      # the briefing still publishes if a market data source is down
        run: |
          pip install -q -r requirements.txt
          python -m src.pipeline --history site/briefing/data/score_history.json
          cp site/briefing/data/score_history.json site/briefing/score_history.json

      - name: Build the page and the group message
        run: |
          python scripts/briefing_site.py site/briefing site/briefing/data "$SITE_URL"
          test -s site/briefing/share.png || echo "::warning::share.png was not made (see the log above)"
          { echo '### 群消息 (paste into the group; add the tool guide on your laptop)'; echo '```'; cat site/briefing/message_zh.txt; echo '```';
            echo '### English message'; echo '```'; cat site/briefing/message.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        working-directory: site
        run: |
          python - << 'PY'
          import glob, json, sys
          files = glob.glob("briefing/data/????-??-??-*.json")
          if not files:
              sys.exit(0)
          eds = []
          for path in files:
              try:
                  eds.append(json.load(open(path, encoding="utf-8")))
              except (OSError, json.JSONDecodeError):
                  continue
          if not eds:
              sys.exit(0)
          ed = max(eds, key=lambda e: str(e.get("generated_at") or ""))
          if ed.get("held"):
              reason = str(ed.get("held_reason") or "a Gemini check reported MISMATCH or HOLD")
              print("Held. " + reason, file=sys.stderr)
              sys.exit(1)
          PY
          git config user.name "cassandra-briefing"
          git config user.email "cassandra-briefing@users.noreply.github.com"
          git add briefing
          if git diff --cached --quiet; then echo "nothing new to publish"; exit 0; fi
          git commit -m "briefing: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
